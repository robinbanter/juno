name: CI

on:
  push:
    branches: [main, juno-integration]
  pull_request:
  workflow_dispatch:

# Everything here runs without secrets: the unit suite, a real production
# build, and a typecheck over the route types that build generates. Nothing
# touches the network — the unit suites are pure logic — so a red run means
# the code, not devnet.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx vitest run tests/unit

      - name: Production build
        run: npm run build
        env:
          # Build-time placeholders. Every Juno route that reads the database
          # or the chain is dynamic, so none of these is contacted here; real
          # values are injected by the host at deploy.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_SOLANA_CLUSTER: devnet
          SESSION_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret

      - name: Typecheck
        # After the build, which generates the route types this depends on.
        run: npx tsc --noEmit

      - name: Service worker was generated
        # The PWA breaks silently if the webpack build stops emitting this.
        run: test -s public/sw.js
